substitutions:
  name: lumentree-inverter
  device_description: "Monitor and control Lumentree solar inverter via BLE"
  external_components_source: github://syssi/esphome-lumentree@main
  mac_address: "AA:BB:CC:DD:EE:FF"  # Replace with your inverter's MAC address

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-lumentree"
    version: 1.2.0

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: VERY_VERBOSE
  logs:
    esp32_ble: DEBUG
    esp32_ble_tracker: INFO
    lumentree_ble: VERY_VERBOSE
    scheduler: INFO
    component: INFO
    sensor: DEBUG
    mqtt: INFO
    mqtt.idf: INFO
    mqtt.component: INFO
    mqtt.sensor: INFO
    mqtt.switch: INFO
    api.service: INFO
    api: INFO

api:

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

ble_client:
  - mac_address: ${mac_address}
    id: client0

lumentree_ble:
  - ble_client_id: client0
    id: inverter0

binary_sensor:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    grid_connected:
      name: "grid connected"
    battery_connected:
      name: "battery connected"
    pv2_support:
      name: "pv2 support"

sensor:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    battery_voltage:
      name: "battery voltage"
    battery_current:
      name: "battery current"
    battery_power:
      name: "battery power"
    battery_soc:
      name: "battery state of charge"
    ac_output_voltage:
      name: "ac output voltage"
    ac_input_voltage:
      name: "ac input voltage"
    ac_output_frequency:
      name: "ac output frequency"
    ac_input_frequency:
      name: "ac input frequency"
    ac_power:
      name: "ac power"
    pv_voltage:
      name: "pv voltage"
    pv_power:
      name: "pv power"
    grid_power:
      name: "grid power"
    load_power:
      name: "load power"
    device_temperature:
      name: "device temperature"
    pv2_voltage:
      name: "pv2 voltage"
    pv2_power:
      name: "pv2 power"
    device_type_image:
      name: "device type image"
    battery_status:
      name: "battery status"
    grid_connection_status:
      name: "grid connection status"
    device_type:
      name: "device type"
    device_power_rating_code:
      name: "device power rating code"
    device_power_rating:
      name: "device power rating"
    ac_output_apparent_power:
      name: "ac output apparent power"
    grid_ct_power:
      name: "grid ct power"
    today_pv_production:
      name: "today pv production"
    today_essential_load:
      name: "today essential load"
    today_total_consumption:
      name: "today total consumption"
    today_grid_consumption:
      name: "today grid consumption"
    today_battery_charging:
      name: "today battery charging"
    today_battery_discharge:
      name: "today battery discharge"
    grid_export:
      name: "grid export"

text_sensor:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    serial_number:
      name: "serial number"
    operation_mode:
      name: "operation mode"
    device_model:
      name: "device model"

select:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    operation_mode:
      name: "operation mode"

switch:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    ac_charging:
      name: "ac charging"
    output:
      name: "output"

  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0


button:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    battery_settings_reset:
      name: "battery settings reset"

number:
  - platform: lumentree_ble
    lumentree_ble_id: inverter0
    power_output_setting:
      name: "power output setting"
    equalization_voltage_setting:
      name: "equalization voltage setting"
    charging_target_voltage_setting:
      name: "charging target voltage setting"
    float_charge_voltage_setting:
      name: "float charge voltage setting"
    battery_capacity_setting:
      name: "battery capacity setting"
      unit_of_measurement: "Ah"
